<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Lamp & Lightning Icon -->
  <g transform="translate(10, 10)">
    <!-- Rounded Background Icon Tile -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#emeraldGrad)" />
    
    <!-- Magic Lamp Base & Body -->
    <path d="M 25 70 C 35 70, 38 78, 50 78 C 62 78, 65 70, 75 70 C 78 70, 80 72, 80 75 C 80 78, 65 85, 50 85 C 35 85, 20 78, 20 75 C 20 72, 22 70, 25 70 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    
    <!-- Lamp Vessel -->
    <path d="M 32 55 Q 50 48 68 55 Q 75 62 65 70 Q 50 72 35 70 Q 25 62 32 55 Z" fill="url(#goldGrad)" />
    
    <!-- Handle -->
    <path d="M 28 58 C 16 54, 16 70, 26 68" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Spout & Lightning Bolt Express Beam -->
    <path d="M 66 57 Q 76 52 82 44" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Lightning Bolt Flash -->
    <polygon points="76,20 62,42 74,42 60,65 88,36 74,36" fill="#FFFBEB" filter="url(#glow)" />
    <polygon points="77,22 65,40 75,40 64,58 84,38 75,38" fill="url(#goldGrad)" />
  </g>

  <!-- Typography: ALADIN EXPRESS -->
  <g transform="translate(130, 75)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="900" font-size="46" fill="#FFFFFF" letter-spacing="-1">
      ALADIN
    </text>
    <text x="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="46" fill="url(#goldGrad)" letter-spacing="1">
      EXPRESS
    </text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#10B981" letter-spacing="4">
      INSTANT ON-DEMAND DELIVERY
    </text>
  </g>
</svg>
