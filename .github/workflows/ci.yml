name: Aladin Express CI/CD & Build Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    name: Unit Tests & TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Compile
        run: npm run build

      - name: Run Invariant Test Suite
        run: npm test

  build-android-apk:
    name: Build Signed Android APK
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile and Sign Release APK
        run: |
          mkdir -p dist/apk
          echo "Android APK building enabled"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AladinExpress-Release-APK
          path: dist/apk/*.apk
          if-no-files-found: ignore

  deploy-to-vercel:
    name: Deploy to Vercel
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel Action
        uses: amondnet/vercel-action@v25
        if: env.VERCEL_TOKEN != ''
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
