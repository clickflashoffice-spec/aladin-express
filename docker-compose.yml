version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: yassir-postgres
    restart: always
    environment:
      POSTGRES_DB: yassir_express
      POSTGRES_USER: yassir_admin
      POSTGRES_PASSWORD: yassir_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schemas/database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yassir_admin -d yassir_express"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: yassir-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yassir-express-gateway
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://yassir_admin:yassir_secure_password_2026@postgres:5432/yassir_express?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports:
      - "8080:8080"

volumes:
  pgdata:
  redisdata:
