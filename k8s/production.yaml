apiVersion: apps/v1
kind: Deployment
metadata:
  name: yassir-express-gateway
  namespace: yassir-prod
  labels:
    app: yassir-express
    tier: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: yassir-express
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: yassir-express
        tier: gateway
    spec:
      containers:
        - name: gateway
          image: gcr.io/yassir-infrastructure/express-gateway:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: yassir-express-config
            - secretRef:
                name: yassir-express-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: yassir-express-service
  namespace: yassir-prod
  labels:
    app: yassir-express
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: yassir-express
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yassir-express-ingress
  namespace: yassir-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "yassir-express-service"
spec:
  tls:
    - hosts:
        - api.yassir.io
        - tracking.yassir.io
      secretName: yassir-tls-certs
  rules:
    - host: api.yassir.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yassir-express-service
                port:
                  number: 80
    - host: tracking.yassir.io
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: yassir-express-service
                port:
                  number: 80
